<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="miraBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="miraStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="miraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Brand Tile -->
  <rect width="512" height="512" rx="128" fill="url(#miraBgGrad)" />

  <!-- Outer Halo Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#fef08a" stroke-width="8" opacity="0.35" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#fef08a" stroke-width="4" opacity="0.15" stroke-dasharray="12 12" />

  <!-- Main Beacon Star -->
  <g filter="url(#miraGlow)">
    <path d="M 256 80 C 256 180 180 256 80 256 C 180 256 256 332 256 432 C 256 332 332 256 432 256 C 332 256 256 180 256 80 Z" fill="url(#miraStarGrad)" />
    <path d="M 256 160 C 256 210 210 256 160 256 C 210 256 256 302 256 352 C 256 302 302 256 352 256 C 302 256 256 210 256 160 Z" fill="#ffffff" opacity="0.5" />
    <circle cx="256" cy="256" r="28" fill="#ffffff" />
  </g>
</svg>
